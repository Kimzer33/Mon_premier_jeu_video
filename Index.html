<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#10132e">
<title>Star Catcher – Mobile</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at top,#25245b,#090b1d 72%);color:#fff;font-family:Arial,sans-serif;overscroll-behavior:none}
body{min-height:100svh;display:flex;justify-content:center;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}
.game{width:min(100%,760px);text-align:center;padding:8px 0 14px}
h1{font-size:clamp(21px,6vw,32px);margin:5px 0 9px;letter-spacing:2px;color:#ffe66d}
.bar{display:flex;justify-content:space-around;gap:5px;margin:8px 0 10px;font-weight:bold;font-size:clamp(13px,3.6vw,17px)}
canvas{display:block;width:100%;height:auto;aspect-ratio:8/5;border:2px solid #7774d8;border-radius:12px;background:#10132e;box-shadow:0 10px 30px #0008;touch-action:none}
.help{font-size:13px;color:#d6d8ff;margin:9px 4px}
.controls{display:flex;align-items:center;justify-content:center;gap:22px;margin:10px auto 2px;touch-action:none}
.pad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,43px);gap:5px}
.control{border:1px solid #8885e8;border-radius:12px;background:#34346e;color:white;font-size:23px;font-weight:bold;touch-action:none;user-select:none;-webkit-user-select:none;display:grid;place-items:center}
.control:active,.control.pressed{background:#6865c9}
.pad .up{grid-column:2;grid-row:1}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}
.joystick-note{font-size:12px;color:#bfc3ff;max-width:125px;line-height:1.4}
button#restart{border:0;border-radius:999px;padding:11px 22px;margin:9px 0 0;color:#17152f;background:#ffe66d;font-weight:bold;font-size:15px}
@media (min-width:650px){.controls{display:none}.help{font-size:14px}}
</style>
</head>
<body>
<div class="game">
<h1>⭐ STAR CATCHER ⭐</h1>
<div class="bar">
<span>Score : <span id="score">0</span></span>
<span>Temps : <span id="time">60</span>s</span>
<span>Record : <span id="best">0</span></span>
</div>
<canvas id="game" width="800" height="500"></canvas>
<div class="controls" aria-label="Commandes tactiles">
  <div class="pad">
    <div class="control up" data-key="up">▲</div>
    <div class="control left" data-key="left">◀</div>
    <div class="control down" data-key="down">▼</div>
    <div class="control right" data-key="right">▶</div>
  </div>
  <div class="joystick-note">Utilise les flèches tactiles pour piloter ton vaisseau.</div>
</div>
<button id="restart">Recommencer</button>
<p class="help">Sur ordinateur : flèches ou ZQSD. Sur iPhone : boutons tactiles. Attrape les étoiles ⭐ et évite les météorites ☄️.</p>
</div>
<script>
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const scoreEl=document.getElementById("score"),timeEl=document.getElementById("time"),bestEl=document.getElementById("best");
let player,stars,rocks,score,running,keys,lastTime,spawnStar,spawnRock,startTime,best=Number(localStorage.getItem("starCatcherBest")||0);
bestEl.textContent=best;
function reset(){
 player={x:400,y:420,r:17,speed:300};stars=[];rocks=[];score=0;running=true;keys={};
 lastTime=performance.now();startTime=lastTime;spawnStar=0;spawnRock=0;
 scoreEl.textContent=0;timeEl.textContent=60;requestAnimationFrame(loop);
}
function addStar(){stars.push({x:25+Math.random()*750,y:-15,r:10,speed:125+Math.random()*65})}
function addRock(){let r=13+Math.random()*12;rocks.push({x:r+Math.random()*(800-2*r),y:-r,r,speed:150+Math.random()*100})}
function hit(a,b){return Math.hypot(a.x-b.x,a.y-b.y)<a.r+b.r}
function background(){
 ctx.fillStyle="#10132e";ctx.fillRect(0,0,800,500);
 for(let i=0;i<65;i++){let x=i*137%800,y=(i*83+performance.now()*.015)%500;ctx.globalAlpha=.35+(i%4)*.15;ctx.fillStyle=i%3===0?"#8fa8ff":"#fff";ctx.fillRect(x,y,2,2)}
 ctx.globalAlpha=1;
}
function drawPlayer(){
 ctx.save();ctx.translate(player.x,player.y);ctx.fillStyle="#ff9f43";
 ctx.beginPath();ctx.moveTo(-8,13);ctx.lineTo(0,29+Math.random()*5);ctx.lineTo(8,13);ctx.fill();
 ctx.fillStyle="#65e6ff";ctx.beginPath();ctx.moveTo(0,-23);ctx.lineTo(19,17);ctx.lineTo(0,10);ctx.lineTo(-19,17);ctx.closePath();ctx.fill();
 ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(0,0,6,0,Math.PI*2);ctx.fill();ctx.restore();
}
function draw(){
 background();for(const s of stars){ctx.font="25px Arial";ctx.textAlign="center";ctx.fillText("⭐",s.x,s.y+8)}
 for(const r of rocks){ctx.font=`${r.r*2}px Arial`;ctx.textAlign="center";ctx.fillText("☄️",r.x,r.y+r.r/2)}
 drawPlayer();
 if(!running){ctx.fillStyle="#080a1ddd";ctx.fillRect(0,0,800,500);ctx.textAlign="center";ctx.fillStyle="#ffe66d";ctx.font="bold 46px Arial";ctx.fillText("PARTIE TERMINÉE",400,220);ctx.fillStyle="#fff";ctx.font="26px Arial";ctx.fillText("Ton score : "+score,400,270);ctx.font="18px Arial";ctx.fillText("Appuie sur Recommencer",400,315)}
}
function loop(now){
 if(!running){draw();return}
 const dt=Math.min((now-lastTime)/1000,.04);lastTime=now;
 if(keys.left||keys.ArrowLeft||keys.q||keys.a)player.x-=player.speed*dt;
 if(keys.right||keys.ArrowRight||keys.d)player.x+=player.speed*dt;
 if(keys.up||keys.ArrowUp||keys.z||keys.w)player.y-=player.speed*dt;
 if(keys.down||keys.ArrowDown||keys.s)player.y+=player.speed*dt;
 player.x=Math.max(22,Math.min(778,player.x));player.y=Math.max(28,Math.min(472,player.y));
 spawnStar-=dt;spawnRock-=dt;if(spawnStar<=0){addStar();spawnStar=.75}if(spawnRock<=0){addRock();spawnRock=Math.max(.45,1.15-score*.008)}
 for(const s of stars)s.y+=s.speed*dt;for(const r of rocks)r.y+=r.speed*dt;
 stars=stars.filter(s=>{if(hit(player,s)){score+=10;scoreEl.textContent=score;return false}return s.y<530});
 for(const r of rocks)if(hit(player,r)){running=false;break}
 rocks=rocks.filter(r=>r.y<540);
 const remaining=Math.max(0,Math.ceil((60000-(now-startTime))/1000));timeEl.textContent=remaining;
 if(now-startTime>=60000)running=false;
 if(!running){if(score>best){best=score;localStorage.setItem("starCatcherBest",best);bestEl.textContent=best}draw();return}
 draw();requestAnimationFrame(loop);
}
document.addEventListener("keydown",e=>{if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(e.key))e.preventDefault();keys[e.key]=true});
document.addEventListener("keyup",e=>keys[e.key]=false);
document.querySelectorAll(".control").forEach(el=>{
 const key=el.dataset.key;
 const down=e=>{e.preventDefault();keys[key]=true;el.classList.add("pressed")};
 const up=e=>{e.preventDefault();keys[key]=false;el.classList.remove("pressed")};
 el.addEventListener("pointerdown",down);el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up);el.addEventListener("pointerleave",up);
});
document.getElementById("restart").addEventListener("click",reset);
reset();
</script>
</body>
</html>
